packages:
  - apps/*
  - packages/*
# Native binaries for tsx/drizzle-kit (esbuild) and eslint's resolver; pnpm 12 refuses unlisted build scripts in CI.
allowBuilds:
  esbuild: true
  unrs-resolver: true
# @paypal/mcp pins @opentelemetry/api 1.9.0; one version keeps a single drizzle-orm instance across packages.
overrides:
  "@opentelemetry/api": "1.9.1"

# Render Blueprint: web service, background worker, Postgres. Jobs live in Postgres too (pg-boss).
services:
  - type: web
    name: milestone-web
    runtime: node
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @milestone/web build
    startCommand: pnpm --filter @milestone/web start
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase: { name: milestone-db, property: connectionString }
      - fromGroup: milestone-secrets
  - type: worker
    name: milestone-worker
    runtime: node
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm --filter @milestone/worker start
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase: { name: milestone-db, property: connectionString }
      - fromGroup: milestone-secrets
databases:
  - name: milestone-db
    plan: basic-256mb
envVarGroups:
  - name: milestone-secrets
    envVars:
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GITHUB_TOKEN
        sync: false

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: milestone
      POSTGRES_PASSWORD: milestone
      POSTGRES_DB: milestone
    ports: ["${POSTGRES_PORT:-5432}:5432"]   # POSTGRES_PORT in .env when :5432 is taken
    volumes: ["pgdata:/var/lib/postgresql/data"]
volumes:
  pgdata:

openapi: 3.1.0
info:
  title: Milestone API
  version: 0.2.0
  summary: HTTP routes of apps/web
  description: |
    Routes under apps/web/src/app/api. Authentication is a role cookie, `milestone_actor`, set by the role switcher
    in the UI. Values: usr_client, usr_freelancer, usr_partner. A missing or unknown cookie acts as the client.
    This is a hackathon stand-in for real sign-in. The two webhook routes do not use the cookie; they verify a
    signature instead.

    Deliveries are created by the GitHub webhook (source github_pr), by /api/milestones/{id}/deliver (manual) or by
    /api/milestones/{id}/upload (upload). Advances go through /api/advances/offer and /api/advances/accept. The
    /api/dev/paypal/* routes exist only while PAYPAL_MODE=simulated and answer 404 otherwise (mode answers always).
    Roles: usr_client, usr_freelancer and usr_partner act on the demo contracts; the freelancer and client checks
    compare the cookie's user with the contract's parties.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:3000
    description: Local development
security:
  - roleCookie: []
tags:
  - name: contracts
  - name: milestones
  - name: paypal
  - name: webhooks
  - name: deliveries
  - name: advances
  - name: ops
  - name: dev
paths:
  /api/contracts:
    post:
      tags: [contracts]
      operationId: createContract
      summary: Compile a scope into a draft contract
      description: |
        Form post from the New contract page. With ANTHROPIC_API_KEY set, Claude compiles the scope; otherwise a
        three-milestone demo contract is built. Responds with a 303 redirect to the contract page.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/CreateContractForm"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CreateContractForm"
      responses:
        "303":
          description: Redirect to /contracts/{id}
          headers:
            Location: { schema: { type: string } }
        "502":
          description: The compiler failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/contracts/{id}/approve:
    post:
      tags: [contracts]
      operationId: approveContract
      summary: Approve a contract as the client or the freelancer
      description: Records the caller's approval time. When both have approved, the contract becomes active.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, example: ctr_demo }
      responses:
        "303":
          description: Redirect to /contracts/{id}
        "403":
          description: Only the client or freelancer can approve
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: Contract not found
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /api/milestones/{id}/order:
    post:
      tags: [milestones]
      operationId: createFundingOrder
      summary: Create or replay the PayPal order that funds a milestone
      description: Client only. The contract must be active and the milestone in draft. Repeated calls return the same order.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, example: mst_1 }
      responses:
        "200":
          description: Order created
          content:
            application/json:
              schema:
                type: object
                required: [orderId]
                properties:
                  orderId: { type: string }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/PayPalError" }
  /api/milestones/{id}/capture:
    post:
      tags: [milestones]
      operationId: captureFunding
      summary: Capture the approved order and fund the milestone
      description: Client only. Idempotent; a milestone already past draft returns its current status.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, example: mst_1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId]
              properties:
                orderId: { type: string }
      responses:
        "200":
          description: Funded, or already past draft
          content: { application/json: { schema: { $ref: "#/components/schemas/CaptureResult" } } }
        "202":
          description: PayPal holds the capture as pending; the capture-completed webhook finishes funding
          content: { application/json: { schema: { $ref: "#/components/schemas/CaptureResult" } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: Captured amount differs from the milestone, or the order or contract state does not allow funding
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "502": { $ref: "#/components/responses/PayPalError" }
  /api/milestones/{id}/review:
    post:
      tags: [milestones]
      operationId: reviewMilestone
      summary: Client response during the review window or on a needs_client decision
      description: |
        Client only. approve (from review or needs_client) and confirm_partial (from needs_client) queue the release
        job. veto (from review) and hold (from needs_client) move the milestone to held. Refused once the payout has
        been claimed, after the window closed (veto and hold), or when a required criterion did not pass.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, example: mst_1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [approve, veto, confirm_partial, hold] }
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [ok, queued]
                    properties:
                      ok: { type: boolean }
                      queued: { type: string, const: release }
                  - type: object
                    required: [ok, status, changed]
                    properties:
                      ok: { type: boolean }
                      status: { type: string, const: held }
                      changed: { type: boolean }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: Not allowed in the current state
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      reason:
                        type: string
                        description: For example review_window_closed, needs_operator, payout_sent, required_criteria_not_passed
                      criteria:
                        type: array
                        items: { type: string }
  /api/paypal/client-token:
    get:
      tags: [paypal]
      operationId: getClientToken
      summary: Browser token for PayPal JS SDK v6
      responses:
        "200":
          description: Short-lived token
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, expiresIn]
                properties:
                  accessToken: { type: string }
                  expiresIn: { type: integer, description: Seconds }
  /api/webhooks/paypal:
    post:
      tags: [webhooks]
      operationId: receivePayPalWebhook
      summary: PayPal webhook receiver
      description: |
        Verified with PayPal's verify-webhook-signature call against PAYPAL_WEBHOOK_ID, stored once by event id, then
        routed. In PAYPAL_MODE=simulated the signature call is replaced by the X-Milestone-Simulated header (the shared
        SIMULATED_WEBHOOK_SECRET, default "dev"), which the simulator sends itself about 1.5 seconds after a capture,
        payout or refund. Handled events: CHECKOUT.ORDER.APPROVED, PAYMENT.CAPTURE.COMPLETED, PAYMENT.CAPTURE.REFUNDED,
        PAYMENT.PAYOUTS-ITEM.* and PAYMENT.PAYOUTSBATCH.DENIED. Others are stored for the audit log. Returns 500
        when an event is not processed yet so PayPal redelivers.
      security: []
      parameters:
        - { name: PAYPAL-TRANSMISSION-ID, in: header, schema: { type: string } }
        - { name: PAYPAL-TRANSMISSION-TIME, in: header, schema: { type: string } }
        - { name: PAYPAL-TRANSMISSION-SIG, in: header, schema: { type: string } }
        - { name: PAYPAL-CERT-URL, in: header, schema: { type: string } }
        - { name: PAYPAL-AUTH-ALGO, in: header, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PayPalWebhookEvent" }
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  duplicate: { type: boolean }
                  outcome: { type: string, description: "funded, already, pending, mismatch, rejected, enqueued, stored or ignored" }
        "400": { description: Bad signature (or a missing simulated header in simulated mode) }
        "500": { description: Not processed yet, or PAYPAL_WEBHOOK_ID not set }
  /api/webhooks/github:
    post:
      tags: [webhooks]
      operationId: receiveGitHubWebhook
      summary: GitHub repository webhook receiver
      description: |
        Verified with the X-Hub-Signature-256 HMAC against GITHUB_WEBHOOK_SECRET and stored once by
        X-GitHub-Delivery. A merged pull request from a branch named m<seq>-... on a contract's repository creates a
        delivery and a verify job. Everything else is ignored.
      security: []
      parameters:
        - { name: X-Hub-Signature-256, in: header, required: true, schema: { type: string } }
        - { name: X-GitHub-Delivery, in: header, required: true, schema: { type: string } }
        - { name: X-GitHub-Event, in: header, required: true, schema: { type: string, example: pull_request } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GitHubPullRequestEvent" }
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  duplicate: { type: boolean }
                  ignored: { type: boolean }
                  milestoneId: { type: string }
                  deliveryId: { type: string }
        "400": { description: Bad signature }
        "500": { description: GITHUB_WEBHOOK_SECRET not set }
  /api/ops/{milestoneId}/resolve:
    post:
      tags: [ops]
      operationId: resolveOperatorCase
      summary: Record that an operator resolved a flagged milestone
      description: |
        Partner or platform role only. Requires the latest operator event for the milestone to be
        milestone.needs_operator. Writes an ops.resolved audit entry; it does not move money or change the status.
      parameters:
        - { name: milestoneId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: string, minLength: 1 }
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/milestones/{id}/deliver:
    post:
      tags: [deliveries]
      operationId: deliverRepository
      summary: Deliver a commit from a repository (manual delivery)
      description: |
        The contract's freelancer only, while the milestone is funded or held. The ref (default HEAD) is resolved to a
        commit with git ls-remote, a delivery with source `manual` is stored in the GitHub webhook's payload shape
        (the baseline for the tamper check is the milestone's funding-time sha), and a verify job is queued. The same
        milestone and commit give the same delivery id, so a repeat returns `duplicate: true`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, example: mst_1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManualDeliveryRequest" }
      responses:
        "200":
          description: Delivery stored and verification queued
          content:
            application/json:
              schema:
                type: object
                required: [ok, deliveryId, sha, duplicate]
                properties:
                  ok: { type: boolean }
                  deliveryId: { type: string }
                  sha: { type: string, description: 40-character commit id }
                  duplicate: { type: boolean }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422":
          description: git ls-remote failed or the ref was not found
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /api/milestones/{id}/upload:
    post:
      tags: [deliveries]
      operationId: uploadFiles
      summary: Deliver files (upload delivery)
      description: |
        The contract's freelancer only, while the milestone is funded or held. Up to 10 files of 20 MB each, sent as
        multipart field `files`, optional text field `note`. Files are stored under UPLOAD_DIR/<deliveryId>/ (default
        var/uploads) with their sha256, a delivery with source `upload` is recorded, and a verify job runs the upload
        checks (format by magic bytes, size, image dimensions, PDF page count, word count, required strings) and the
        judgment stage. There is no tamper check for uploads. Delivered files are untrusted evidence.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, example: mst_brand_1 }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  maxItems: 10
                  items: { type: string, format: binary }
                note: { type: string, description: Optional note to the reviewer, maxLength: 10000 }
      responses:
        "200":
          description: Files stored and verification queued
          content:
            application/json:
              schema:
                type: object
                required: [ok, deliveryId, files]
                properties:
                  ok: { type: boolean }
                  deliveryId: { type: string, example: dlv_up_0123456789abcdef01234567 }
                  files:
                    type: array
                    items: { $ref: "#/components/schemas/StoredFile" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413":
          description: Too many bytes (a file over 20 MB, or a request over 10 files of 20 MB)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /api/files/{deliveryId}/{name}:
    get:
      tags: [deliveries]
      operationId: getDeliveredFile
      summary: Download or view a delivered file
      description: |
        Only the contract's client and freelancer. Served with a sandboxing Content-Security-Policy and nosniff;
        images and PDFs open inline, everything else downloads as an attachment. The X-File-Sha256 header carries the
        stored hash. Errors are plain text.
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string }, example: dlv_up_0123456789abcdef01234567 }
        - { name: name, in: path, required: true, schema: { type: string }, example: logo.svg }
      responses:
        "200":
          description: The file
          headers:
            X-File-Sha256: { schema: { type: string } }
          content:
            "*/*":
              schema: { type: string, format: binary }
        "403": { description: Not a party to the contract, content: { text/plain: { schema: { type: string } } } }
        "404": { description: Unknown delivery, not an upload delivery, or unknown file name, content: { text/plain: { schema: { type: string } } } }
  /api/advances/offer:
    get:
      tags: [advances]
      operationId: getAdvanceOffer
      summary: Price an advance against a funded milestone
      description: |
        The contract's freelancer only. If the milestone already has an advance (one per milestone) it is returned with
        its stored offer. Otherwise a fresh offer is priced from the database; an ineligible milestone answers 200 with
        `offer.eligible: false` and a reason. The explanation is two sentences from Claude when ANTHROPIC_API_KEY is set,
        otherwise built from the numbers. The model never changes the numbers.
      parameters:
        - { name: milestoneId, in: query, required: true, schema: { type: string }, example: mst_1 }
      responses:
        "200":
          description: Offer or existing advance
          content: { application/json: { schema: { $ref: "#/components/schemas/AdvanceOfferResponse" } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/advances/accept:
    post:
      tags: [advances]
      operationId: acceptAdvance
      summary: Accept the advance offer ("Get paid now")
      description: |
        The contract's freelancer only. Under row locks the offer is re-priced from the database and stored as an
        advance with status `offered`, `advance.accepted` is audited, and the `advance` job is queued; the job pays the
        principal from the capital partner's PayPal account. One advance per milestone: a second call returns the
        existing advance with 200 and `created: false`. The release repays the partner first (principal plus the quoted
        fee) and pays the freelancer the rest.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [milestoneId]
              properties:
                milestoneId: { type: string }
      responses:
        "200":
          description: An advance already existed
          content: { application/json: { schema: { $ref: "#/components/schemas/AdvanceAcceptResponse" } } }
        "201":
          description: Advance created and queued
          content: { application/json: { schema: { $ref: "#/components/schemas/AdvanceAcceptResponse" } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: Not eligible, or a PayPal email is missing
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      reason:
                        type: string
                        description: not_eligible, no_paypal_email or no_partner_paypal_email
        "503":
          description: No capital partner is configured
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /api/dev/paypal/mode:
    get:
      tags: [dev]
      operationId: getPayPalMode
      summary: Which PayPal the server talks to
      security: []
      description: Answers in every mode. The fund button asks when it was not told.
      responses:
        "200":
          description: Mode
          content:
            application/json:
              schema:
                type: object
                required: [mode]
                properties:
                  mode: { type: string, enum: [simulated, sandbox] }
  /api/dev/paypal/approve:
    get:
      tags: [dev]
      operationId: approveSimulatedOrder
      summary: Simulated PayPal checkout page
      security: []
      description: |
        Exists only while PAYPAL_MODE is simulated (404 otherwise). The approve link of a simulated order points here. It
        marks the order APPROVED and redirects (303) to /contracts/{contractId}?approved=<orderId>&milestone=<id>, where
        the fund button captures it.
      parameters:
        - { name: order, in: query, required: true, schema: { type: string } }
      responses:
        "303":
          description: Redirect back to the contract page
          headers:
            Location: { schema: { type: string } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/dev/paypal/fail:
    post:
      tags: [dev]
      operationId: armSimulatedPayoutFailure
      summary: Make the next simulated payout item fail
      security: []
      description: |
        Exists only while PAYPAL_MODE is simulated (404 otherwise). Arms a one-shot failure: the next payout item with
        this sender_item_id comes back FAILED, so the release goes to `held` with `milestone.needs_operator`. Release
        items use `<milestoneId>:freelancer` and `<milestoneId>:partner`. Accepts JSON, or a form post (the /ops
        "Simulate payout failure" button).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArmFailureRequest" }
          application/x-www-form-urlencoded:
            schema: { $ref: "#/components/schemas/ArmFailureRequest" }
      responses:
        "200":
          description: Armed
          content:
            application/json:
              schema:
                type: object
                properties:
                  armed:
                    type: object
                    properties:
                      senderItemId: { type: string }
                      reason: { type: string, example: RECEIVER_ACCOUNT_LOCKED }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    get:
      tags: [dev]
      operationId: listArmedFailures
      summary: List armed simulated payout failures
      security: []
      responses:
        "200":
          description: Armed failures
          content:
            application/json:
              schema:
                type: object
                properties:
                  armed:
                    type: array
                    items:
                      type: object
                      properties:
                        senderItemId: { type: string }
                        reason: { type: string }
        "404": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    roleCookie:
      type: apiKey
      in: cookie
      name: milestone_actor
      description: One of usr_client, usr_freelancer, usr_partner. Demo stand-in for sign-in.
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PayPalError:
      description: PayPal call failed
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  debugId: { type: [string, "null"] }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    CreateContractForm:
      type: object
      required: [scope, total]
      properties:
        scope: { type: string, description: Plain-English scope }
        title: { type: string, maxLength: 120, description: Optional; defaults to the compiled title }
        currency: { type: string, minLength: 3, maxLength: 3, default: USD }
        total: { type: number, description: Total in major units, for example 300.00 }
        repo: { type: string, description: "owner/name of the delivery repository" }
    ManualDeliveryRequest:
      type: object
      required: [repoUrl]
      properties:
        repoUrl: { type: string, description: "https URL, file:// URL or absolute local path; ssh, git:// and credentials in the URL are refused", example: /tmp/milestone-demo }
        ref: { type: string, default: HEAD, description: Branch, tag, HEAD or a 40-character commit id, example: m1-pass }
        title: { type: string, maxLength: 200 }
        note: { type: string, maxLength: 10000 }
    StoredFile:
      type: object
      required: [name, size, sha256, mime]
      properties:
        name: { type: string }
        size: { type: integer }
        sha256: { type: string }
        mime: { type: string }
    UploadCriterionSpec:
      type: object
      description: "spec of a criterion with kind upload. A criterion passes when at least one matching file passes every check."
      required: [pattern]
      properties:
        pattern:
          description: A glob ("*.pdf", "logo/*.{svg,png}") or an extension list ([".svg", ".png"] or "svg,png")
          oneOf:
            - { type: string }
            - { type: array, minItems: 1, items: { type: string } }
        format: { type: string, enum: [pdf, png, jpg, svg, docx, md, txt], description: Checked from magic bytes }
        minBytes: { type: integer, minimum: 0 }
        minWords: { type: integer, minimum: 0, description: "txt, md, docx" }
        maxPages: { type: integer, minimum: 1, description: PDF }
        minWidth: { type: integer, minimum: 1, description: "png, jpg, svg" }
        minHeight: { type: integer, minimum: 1 }
        mustContain:
          type: array
          items: { type: string }
          description: Case-insensitive strings the file text must contain
    ArmFailureRequest:
      type: object
      description: Either sender_item_id, or milestoneId with an optional party.
      properties:
        sender_item_id: { type: string, maxLength: 127, example: "mst_1:freelancer" }
        milestoneId: { type: string }
        party: { type: string, enum: [freelancer, partner], default: freelancer }
        reason: { type: string, description: A PayPal error name, default: RECEIVER_ACCOUNT_LOCKED, example: RECEIVER_UNREGISTERED }
    AdvanceTerms:
      type: object
      properties:
        principalMinor: { type: integer }
        feeBpsPerDay: { type: number }
        days: { type: integer, description: Days until the milestone is due }
        expectedFeeMinor: { type: integer }
        repaymentMinor: { type: integer }
        pFail: { type: number, description: Estimated chance of failing verification }
    AdvanceView:
      type: object
      required: [id, status, principalMinor, feeBpsPerDay, feeMinor, repaymentMinor, fundedAt, repaidAt, explanation]
      properties:
        id: { type: string }
        status: { type: string, enum: [offered, funded, repaid, shortfall] }
        principalMinor: { type: integer }
        feeBpsPerDay: { type: number }
        feeMinor: { type: integer }
        repaymentMinor: { type: integer, description: Principal plus the quoted fee, deducted from the release }
        fundedAt: { type: [string, "null"], format: date-time }
        repaidAt: { type: [string, "null"], format: date-time }
        explanation: { type: [string, "null"] }
    AdvanceOfferResponse:
      type: object
      required: [milestoneId, currency, amountMinor, advance, offer, terms, explanation, explanationSource]
      properties:
        milestoneId: { type: string }
        currency: { type: string }
        amountMinor: { type: integer }
        advance: { oneOf: [{ $ref: "#/components/schemas/AdvanceView" }, { type: "null" }] }
        offer:
          type: object
          description: "Includes eligible (boolean) and, when not eligible, reason"
          additionalProperties: true
        terms: { oneOf: [{ $ref: "#/components/schemas/AdvanceTerms" }, { type: "null" }] }
        explanation: { type: string }
        explanationSource: { type: string, enum: [model, rules, stored] }
    AdvanceAcceptResponse:
      type: object
      required: [advance, created, queued]
      properties:
        advance: { $ref: "#/components/schemas/AdvanceView" }
        created: { type: boolean }
        queued: { type: boolean, description: Whether the advance job was queued by this call }
    CaptureResult:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/MilestoneStatus" }
        captureId: { type: [string, "null"] }
        captureStatus: { type: string }
    MilestoneStatus:
      type: string
      enum: [draft, funded, verifying, review, released, held, needs_client, partial_released]
    CriterionKind:
      type: string
      enum: [test, build, file, visual, judgment, upload]
    CriterionSpec:
      type: object
      required: [id, kind, description]
      properties:
        id: { type: string }
        kind: { $ref: "#/components/schemas/CriterionKind" }
        description: { type: string }
        spec: { type: object, additionalProperties: true }
        required: { type: boolean, default: true }
    MilestoneSpec:
      type: object
      required: [seq, title, amountMinor, criteria]
      properties:
        seq: { type: integer, minimum: 1 }
        title: { type: string }
        amountMinor: { type: integer, minimum: 1 }
        dueAt: { type: string }
        criteria:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/CriterionSpec" }
    ContractSpec:
      type: object
      description: The compiler's output (zod ContractSpec in packages/core)
      required: [title, currency, totalMinor, milestones]
      properties:
        title: { type: string }
        currency: { type: string, minLength: 3, maxLength: 3 }
        totalMinor: { type: integer, minimum: 1 }
        milestones:
          type: array
          items: { $ref: "#/components/schemas/MilestoneSpec" }
    CriterionVerdict:
      type: object
      required: [criterion_id, status, confidence, evidence_ids, rationale]
      properties:
        criterion_id: { type: string }
        status: { type: string, enum: [pass, fail, unclear] }
        confidence: { type: number, minimum: 0, maximum: 1 }
        evidence_ids: { type: array, items: { type: string } }
        rationale: { type: string }
    PolicyDecision:
      type: object
      required: [action, amountMinor, ruleIds, reason]
      properties:
        action: { type: string, enum: [release, partial, hold, ask_client] }
        amountMinor: { type: integer, minimum: 0 }
        ruleIds: { type: array, items: { type: string } }
        reason: { type: string }
    PayPalWebhookEvent:
      type: object
      required: [id, event_type, create_time]
      properties:
        id: { type: string }
        event_type: { type: string, example: PAYMENT.CAPTURE.COMPLETED }
        create_time: { type: string }
        resource_type: { type: string }
        resource: { type: object, additionalProperties: true }
    GitHubPullRequestEvent:
      type: object
      properties:
        action: { type: string, example: closed }
        pull_request:
          type: object
          properties:
            number: { type: integer }
            merged: { type: boolean }
            merge_commit_sha: { type: [string, "null"] }
            title: { type: [string, "null"] }
            body: { type: [string, "null"] }
            head: { type: object, properties: { ref: { type: string, example: m1-pass } } }
            base: { type: object, properties: { sha: { type: [string, "null"] } } }
        repository:
          type: object
          properties:
            full_name: { type: string }
            clone_url: { type: string }
